[package]
name = "gbz-base"
version = "0.6.2"
edition = "2024"
description = "Pangenome file formats based on SQLite"
license = "MIT"
readme = "README.md"
repository = "https://github.com/jltsiren/gbz-base"

[features]
benchmark = ["rand"]

[dependencies]
# We may need the latest versions of these dependencies during development.
gbz = { version = "0.7" }
#gbz = { git = "https://github.com/jltsiren/gbwt-rs.git", branch = "main" }
simple-sds = { version = "0.4.2" }
#simple-sds = { git = "https://github.com/jltsiren/simple-sds.git", branch = "main" }
pggname = { version = "0.3" }
#pggname = { git = "https://github.com/jltsiren/pggname.git", branch = "main" }
htscodecs-wrapper = { version = "0.1" }
#htscodecs-wrapper = { git = "https://github.com/jltsiren/htscodecs-wrapper.git", branch = "main" }

# Use fallible_uint for getting usize values from query results.
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
getopts = { version = "0.2" }
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1.1", features = ["zlib-rs"] }
zstd = { version = "0.13" }

rand = { version = "0.9", optional = true }

[dev-dependencies]
rand = { version = "0.9" }

[[bin]]
name = "gbz-base"
path = "src/bin/gbz-base.rs"
test = false
bench = false
doc = false

[[bin]]
name = "gaf-base"
path = "src/bin/gaf-base.rs"
test = false
bench = false
doc = false

[[bin]]
name = "gbz2db"
test = false
bench = false
doc = false

[[bin]]
name = "gaf2db"
test = false
bench = false
doc = false

[[bin]]
name = "db2gaf"
test = false
bench = false
doc = false

[[bin]]
name = "query"
test = false
bench = false
doc = false

[[bin]]
name = "gafsort"
test = false
bench = false
doc = false

[[bin]]
name = "codec-benchmark"
required-features = ["benchmark"]
test = false
bench = false
doc = false

[[bin]]
name = "query-benchmark"
required-features = ["benchmark"]
test = false
bench = false
doc = false

[lib]
# Build a .wasm file of the library in addition to the .rlib to link Rust code
crate-type = ["cdylib", "rlib"]
name = "gbz_base"
path = "src/lib.rs"
